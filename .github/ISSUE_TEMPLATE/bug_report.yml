name: Bug report / 오류 신고
description: Startup, rendering or compatibility problems / 실행·표시·호환성 문제
title: "[Bug] "
labels: []
body:
  - type: input
    id: versions
    attributes:
      label: Versions / 버전
      description: Game version and Steam build, mod version, MelonLoader version, Windows version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected/actual behavior / 재현 방법과 예상·실제 동작
      description: Include the screen and whether it occurs without this patch or with other mods.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots / 로그 또는 스크린샷
      description: Relevant Latest.log excerpts; remove personal paths, credentials and private data.
