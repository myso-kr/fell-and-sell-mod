name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (e.g. v0.3.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve and validate tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Expected an existing vX.Y.Z tag'
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tag matches code, changelog and documentation
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python tools/check-repository.py --tag "$RELEASE_TAG"
  build:
    needs: resolve
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
  draft:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts
      - name: Create release draft with verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
            if [[ "$draft" != true ]]; then
              echo '::error::Refusing to replace assets on a published release'
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --notes-file artifacts/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Fell & Sell Korean patch $RELEASE_TAG" --notes-file artifacts/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/*.zip.sha256 --clobber
