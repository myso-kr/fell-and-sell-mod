name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Check rendered links and page metadata
        run: python3 tools/check-site.py _site
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser checks
        run: |
          python -m pip install -r tools/requirements-site.txt
          python -m playwright install --with-deps chromium
      - name: Check all pages in light and dark mode
        run: python tools/check-site-browser.py _site
